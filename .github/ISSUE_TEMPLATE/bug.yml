name: Bug report
description: Report reproducible incorrect behavior in Kept.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not attach personal reminders, memories, credentials, or unsanitized logs.
  - type: input
    id: version
    attributes:
      label: Kept version
      placeholder: 1.1.1 (build 4)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: macOS 26.0, MacBook Air M3
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include expected behavior and sanitized reproduction steps.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Additional context
      description: Add sanitized screenshots or logs only when necessary.
