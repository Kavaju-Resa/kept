name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Repository audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check scripts and secrets
        run: |
          bash -n Scripts/*.sh
          ./Scripts/audit-secrets.sh

  test:
    name: Build and test
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install XcodeGen (pinned)
        run: ./Scripts/install-xcodegen.sh
      - name: Verify generated project
        run: |
          xcodegen generate
          git diff --exit-code -- Kept.xcodeproj
      - name: Run tests
        run: |
          xcodebuild \
            -project Kept.xcodeproj \
            -scheme Kept \
            -destination 'platform=macOS,arch=arm64' \
            -clonedSourcePackagesDirPath build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            test
