name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: >
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA') ||
        github.event.comment.body == 'recheck'))
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/Kavaju-Resa/kept/blob/main/CONTRIBUTOR_LICENSE_AGREEMENT.md
          branch: cla-signatures
          allowlist: Kavaju-Resa,dependabot[bot]
          custom-notsigned-prcomment: >
            Thank you for your contribution. Before it can be merged, please
            read the [Contributor License Agreement](https://github.com/Kavaju-Resa/kept/blob/main/CONTRIBUTOR_LICENSE_AGREEMENT.md)
            and sign it by posting the comment below.
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: All contributors have signed the CLA.
